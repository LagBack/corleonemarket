<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Corleone Market - Cleanup</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#e0e0e0;min-height:100vh;display:flex;align-items:center;justify-content:center}
.c{max-width:700px;width:100%;padding:40px 20px;text-align:center}
h1{font-size:28px;color:#c9a84c;margin-bottom:8px}
p.sub{color:#aaa;font-weight:normal;margin-bottom:24px;line-height:1.5}
.btn{background:#c9a84c;color:#000;border:none;padding:16px 48px;font-size:18px;font-weight:bold;cursor:pointer;border-radius:6px;transition:.2s}
.btn:hover{background:#e0c068}.btn:disabled{background:#333;cursor:wait}
pre{background:#111;border:1px solid #222;border-radius:8px;padding:20px;overflow-x:auto;font-size:13px;line-height:1.6;text-align:center;margin-top:24px}
.ok{color:#4caf50;font-weight:bold;font-size:18px}.err{color:#f44336;font-weight:bold;font-size:14px}
</style>
</head>
<body>
<div class="c">
<h1>&#9733; Corleone Market</h1>
<p class="sub">Limpeza de Empresas Excluidas<br><span style="color:#666;font-size:13px">Acesso com conta admin para ver registros orfaos</span></p>
<button class="btn" id="btn">Executar Limpeza</button>
<div id="out"></div>
</div>
<script>
const btn=document.getElementById('btn'),out=document.getElementById('out');
async function cleanup(){btn.disabled=true;btn.textContent='Executando...';out.innerHTML='<pre>Aguarde...</pre>';try{let r=await fetch('/api/admin/orphans/cleanup',{method:'POST'});let d=await r.json();if(d.ok)out.innerHTML='<div class="ok">&#10003; Limpeza concluda!</div><pre>Empresas removidas: '+d.cleaned+'\nUsuarios reembolsados: '+(d.refundCount||0)+'\nTotal reembolsado: R$'+(d.refunded||0).toFixed(2)+(d.results?'&#10;&#10;'+JSON.stringify(d.results,null,2):'\nNenhum registro encontrado.')</pre>';}catch(e){out.innerHTML='<div class="err">Erro: '+e.message+'</div>';btn.disabled=false;btn.textContent='Tentar novamente';}}
async function audit(){try{let r=await fetch('/api/admin/orphans');let d=await r.json();if(d.orphanCount>0)out.innerHTML+='<pre>'+d.orphanCount+' registros orfaos encontrados\n'+d.usersAffected+' usuarios afetados\nTotal estimado: R$'+d.totalEstimatedRefund.toFixed(2)+'</pre>';}catch(e){}}
btn.addEventListener('click',cleanup);
window.addEventListener('load',()=>setTimeout(audit,500));
</script>
</body>
</html>
